---
- hosts: localhost
  vars:
    clickhouse_dbs_custom:
      - name: test
        state: present
    clickhouse_users_custom: 
      - name: "admin"
        password: "password"
        host: LOCAL
        grant: 'ALL ON *.*'
        grant_option: true
    clickhouse_prometheus_endpoint: true
    clickhouse_tune_os: true

  roles:
    - { role: ../../../clickhouse }
